<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Rich red gradient -->
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF3843" />
      <stop offset="50%" stop-color="#FF1526" />
      <stop offset="100%" stop-color="#D00018" />
    </linearGradient>

    <!-- Red diagonal fold shadow -->
    <linearGradient id="foldGrad" x1="20%" y1="20%" x2="90%" y2="90%">
      <stop offset="0%" stop-color="#E50017" />
      <stop offset="70%" stop-color="#B00012" />
      <stop offset="100%" stop-color="#800008" />
    </linearGradient>

    <!-- White S with subtle metallic sheen -->
    <linearGradient id="whiteGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="60%" stop-color="#F8F9FA" />
      <stop offset="100%" stop-color="#E9ECEF" />
    </linearGradient>

    <!-- Smooth drop shadow -->
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="-2" dy="5" stdDeviation="6" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Black Background -->
  <rect width="512" height="512" fill="#000000" />

  <!-- The Unified Stavio Emblem -->
  <!-- Red Play Button / Rounded Triangle -->
  <!-- Left edge: x=138, y=130 to 360 with r=32 -->
  <!-- Top edge: from (170, 130) to (210, 130) then down-right to apex (312, 280) -->
  <g>
    <!-- Base Red Shape -->
    <path d="M 170 130
             C 148 130, 138 140, 138 162
             L 138 340
             C 138 360, 150 370, 172 364
             L 194 354
             C 240 330, 276 308, 308 288
             C 322 278, 322 260, 306 250
             L 218 152
             C 202 135, 186 130, 170 130
             Z"
          fill="url(#redGrad)" />

    <!-- Red Fold/Crease (Darker Lower Flap) -->
    <path d="M 138 270
             L 282 266
             C 314 274, 314 284, 298 294
             L 194 354
             C 150 370, 138 360, 138 340
             Z"
          fill="url(#foldGrad)" />

    <!-- White Modern 'S' flowing across and underneath -->
    <path d="M 380 90
             C 380 72, 364 58, 344 58
             L 252 58
             C 188 58, 142 104, 142 170
             C 142 216, 174 246, 224 266
             L 276 288
             C 314 304, 332 322, 332 352
             C 332 388, 300 412, 254 412
             C 214 412, 176 392, 150 366
             C 138 354, 120 356, 110 368
             C 100 380, 102 398, 116 412
             C 152 448, 202 470, 256 470
             C 332 470, 392 422, 392 352
             C 392 298, 354 264, 304 242
             L 250 218
             C 216 204, 198 188, 198 162
             C 198 130, 222 114, 256 114
             L 344 114
             C 364 114, 380 102, 380 90
             Z"
          fill="url(#whiteGrad)"
          filter="url(#dropShadow)" />
  </g>
</svg>
