<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF3344"/>
      <stop offset="40%" stop-color="#ED1C24"/>
      <stop offset="100%" stop-color="#C40015"/>
    </linearGradient>
    <linearGradient id="whiteGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E8EAF0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="-4" dy="8" stdDeviation="8" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="110" fill="#000000"/>
  
  <g transform="translate(256, 256)">
    <!-- Red Play Triangle Shape with rounded corners -->
    <path d="M -118 -128
             C -118 -144, -100 -150, -86 -142
             L 54 -62
             C 68 -54, 68 -34, 54 -26
             L -86 54
             C -100 62, -118 56, -118 40
             Z" 
          fill="url(#redGrad)"
          transform="scale(1.8) translate(10, 22)" />
    
    <!-- White Letter S -->
    <!-- Custom sleek S overlapping the red shape -->
    <path d="M 40 -120 
             C 70 -120, 110 -115, 115 -80
             C 120 -40, 20 -15, 10 20
             C 0 50, 40 70, 75 70
             C 95 70, 115 60, 125 50
             L 125 90
             C 105 105, 80 112, 50 112
             C -10 112, -45 80, -40 30
             C -35 -20, 50 -40, 60 -75
             C 70 -100, 30 -108, -10 -95
             Z"
          fill="url(#whiteGrad)"
          filter="url(#shadow)"
          style="display:none;" />
  </g>
</svg>